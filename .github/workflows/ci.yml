name: CI
# Run the full checks manually when needed; everyday changes are verified locally.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        id: python
        with:
          python-version: '3.12'
      - name: Scan public history for secrets
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E') { throw 'Gitleaks checksum mismatch' }
          $scanDir = Join-Path $env:RUNNER_TEMP 'gitleaks'
          Expand-Archive $archive -DestinationPath $scanDir
          & (Join-Path $scanDir 'gitleaks.exe') git . --config .gitleaks.toml --redact --no-banner --log-opts=--all
          if ($LASTEXITCODE -ne 0) { throw 'Secret scan failed' }
      - name: Install, test and build all packages
        env:
          LANJIAN_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: node scripts/ci.mjs all ${{ matrix.shard }}/4
